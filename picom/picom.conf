backend = "glx";
vsync = true;


blur = {
  method = "dual_kawase";
  strength = 7;
  size = 10;
  deviation = 5.0;
  background = true;
  background-frame = true;
  background-fixed = false;
};

fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;

opacity-rule = [
  "90:class_g = 'Alacritty'",
  "90:class_g = 'Rofi'"
];


blur-background-exclude = [
  "class_g = 'slop'",     # NO BLUR IN SCREENSHOTS
  "class_g = 'Xclip'",
  "class_g = 'XClip'",
  "name *= 'maim'",
  "class_g = 'maim'",
];
