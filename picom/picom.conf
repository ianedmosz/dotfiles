backend = "glx";
vsync = true;

# (Old GLX flags below are deprecated on many builds; safe to remove)
# glx-use-copysubbuffer-mesa = true;
# glx-copy-from-front = true;
# glx-swap-method = 2;

# Blur config (ibhagwan/jonaburg-compatible)
blur: {
  method = "dual_kawase";
  strength = 5;          
  background = true;
  background-frame = true;
  background-fixed = false;
}

fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;


# Example opacity rule (fine)
opacity-rule = [
  "95:class_g = 'kitty'"
]
